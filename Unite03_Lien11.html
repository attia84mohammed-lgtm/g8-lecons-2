<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unité 3 – Les pronoms démonstratifs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap');
  :root { --cream:#FFF8EA; --ink:#2E2A26; --gold:#E7B23E; --suis:#8E6FD1; --ai:#EE8A52; --teal:#3EBFAF; --pink:#E15A72; --card-shadow:rgba(46,42,38,0.18); }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family:'Nunito',sans-serif; background:var(--cream); color:var(--ink); overflow:hidden; }
  #stage { position:relative; width:100%; height:100vh; max-height:720px; margin:0 auto; display:flex; align-items:center; justify-content:center; }
  .theme-band { position:absolute; inset:0; z-index:-1; transition: background 0.5s ease; }
  .scene { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:safe center; padding:30px 24px 90px; text-align:center; opacity:0; transform:translateY(14px); transition:opacity .45s ease, transform .45s ease; overflow-y:auto; }
  .scene.active { display:flex; opacity:1; transform:translateY(0); }
  .char-photo { width: clamp(130px, 30vw, 190px); max-height:34vh; border-radius:20px; box-shadow:0 10px 0 var(--card-shadow), 0 10px 24px rgba(0,0,0,0.18); margin-bottom:10px; background:white; padding:6px; object-fit:cover; }
  .struct-badge { display:inline-flex; align-items:center; gap:8px; border-radius:999px; padding:6px 18px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:14px; color:white; margin-bottom:10px; letter-spacing:0.3px; background:var(--suis); }
  .struct-badge.ai { background: var(--ai); } .struct-badge.teal { background: var(--teal); } .struct-badge.pink { background: var(--pink); }
  h1.sense-title { font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(24px,6vw,40px); margin:6px 0 2px; }
  p.sentence { font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(18px,4.6vw,26px); margin:8px 0; max-width:640px; }
  .question-box { margin-top:12px; background:rgba(255,255,255,.85); border-radius:20px; padding:12px 20px; max-width:560px; font-size:clamp(15px,3.4vw,19px); }
  .question-box .q { font-weight:700; }
  .question-box .a { margin-top:6px; opacity:0; max-height:0; overflow:hidden; transition:opacity .4s ease; }
  .question-box .a.shown { opacity:1; max-height:120px; }
  .speak-btn, .reveal-btn { margin-top:12px; margin-right:8px; border:none; border-radius:999px; padding:9px 18px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; cursor:pointer; background:var(--ink); color:white; box-shadow:0 4px 0 rgba(0,0,0,.25); }
  .speak-btn:active, .reveal-btn:active { transform:translateY(3px); box-shadow:none; }
  .intro-row { display:flex; gap:16px; align-items:flex-end; margin:6px 0 10px; }
  .intro-row img { width: clamp(90px,20vw,120px); max-height:24vh; object-fit:cover; border-radius:16px; box-shadow:0 6px 0 var(--card-shadow); background:white; padding:4px; }
  .bubble { background:white; border-radius:16px; padding:10px 16px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(14px,3.2vw,18px); box-shadow:0 5px 0 var(--card-shadow); max-width:560px; }
  .recap-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; max-width:560px; }
  .recap-item { background:white; border-radius:14px; padding:6px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(10px,2.3vw,12px); box-shadow:0 5px 0 var(--card-shadow); opacity:0; transform:scale(.85); transition:opacity .35s ease, transform .35s ease; display:flex; flex-direction:column; justify-content:center; }
  .recap-item.shown { opacity:1; transform:scale(1); }
  .recap-item img { width:100%; height:70px; object-fit:cover; border-radius:8px; margin-bottom:4px; }
  .recap-item .em { font-size:26px; margin-bottom:2px; }
  .quiz-options { display:flex; flex-direction:column; gap:12px; width:100%; max-width:420px; margin-top:14px; }
  .quiz-opt { font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; background:white; border:3px solid transparent; border-radius:16px; padding:11px 18px; cursor:pointer; box-shadow:0 5px 0 var(--card-shadow); transition:transform .15s ease; }
  .quiz-opt:hover { transform:translateY(-2px); }
  .quiz-opt.correct { background:#DFF3DA; border-color:#5BAE5B; }
  .quiz-opt.wrong { background:#FBDDE1; border-color:var(--pink); }
  .quiz-feedback { margin-top:12px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; min-height:28px; }
  .quiz-photo { width: clamp(110px,26vw,150px); max-height:22vh; object-fit:cover; border-radius:16px; box-shadow:0 8px 0 var(--card-shadow); margin-bottom:8px; background:white; padding:5px; }
  .dialogue-line { font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(14px,3.2vw,17px); background:white; border-radius:16px; padding:8px 16px; margin:4px 0; box-shadow:0 5px 0 var(--card-shadow); max-width:520px; text-align:left; cursor:pointer; }
  .dialogue-line .who { color:var(--suis); font-weight:800; margin-right:6px; }
  .dialogue-line .who.b { color:var(--ai); }
  .dialogue-line.c { text-align:center; }
  .dialogue-line em { color:var(--pink); font-style:normal; }
  #nav { position:absolute; bottom:16px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:16px; z-index:5; }
  .nav-btn { background:white; border:none; border-radius:999px; width:44px; height:44px; font-size:19px; cursor:pointer; box-shadow:0 4px 0 var(--card-shadow); }
  .nav-btn:disabled { opacity:.35; cursor:default; }
  #dots { display:flex; gap:6px; flex-wrap:wrap; max-width:260px; justify-content:center; }
  .dot { width:8px; height:8px; border-radius:50%; background:rgba(0,0,0,.18); transition:background .3s ease; }
  .dot.on { background:var(--ink); }
</style>
</head>
<body>
<div id="stage"><div class="theme-band" id="themeBand"></div></div>
<div id="nav"><button class="nav-btn" id="prevBtn" onclick="go(-1)">◀</button><div id="dots"></div><button class="nav-btn" id="nextBtn" onclick="go(1)">▶</button></div>
<script>
const IMG = {};
const quiz = [{"title": "« Si vous voulez un bon melon, je vous conseille … »", "options": ["celui-ci", "ceux-ci", "celle-ci"], "correct": 0}, {"title": "Quel pronom est neutre ?", "options": ["celles", "cela", "celui"], "correct": 1}, {"title": "Pluriel féminin de « celle » :", "options": ["celui", "ceux", "celles"], "correct": 2}, {"title": "« celui-ci » désigne un objet…", "options": ["éloigné", "proche", "absent"], "correct": 1}, {"title": "« Dormir, j'adore … »", "options": ["ceux", "celle", "ça"], "correct": 2}];
const SCENES = ["<div class=\"scene\" data-color=\"var(--gold)\"><div class=\"intro-row\"><\/div><div class=\"bubble\">« Regarde le château de sable, comme il est beau ! »<\/div><h1 class=\"sense-title\" style=\"margin-top:12px;\">Les pronoms démonstratifs<\/h1><p class=\"sentence\">Le pronom démonstratif remplace le nom de ce qu&#x27;on veut montrer.<\/p><button class=\"speak-btn\" onclick=\"speak(&quot;Les pronoms démonstratifs. Regarde le château de sable, comme il est beau ! Oh, regarde celui-ci, il est encore plus beau !&quot;)\">🔊 Écouter<\/button><\/div>", "<div class=\"scene\" data-color=\"var(--suis)\"><h1 class=\"sense-title\" style=\"font-size:24px;\">Définition<\/h1><div class=\"dialogue-line c\" onclick=\"speak(&quot;Le pronom démonstratif remplace le nom de ce qu&#x27;on veut montrer :&quot;)\">Le pronom démonstratif remplace le nom de ce qu'on veut montrer :<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;Regarde le château de sable, comme il est beau ! Oh, regarde celui-ci, il est encore plus beau ! Et celui-là, il est réussi également !&quot;)\">Regarde le château de sable, comme il est beau ! Oh, regarde <em>celui-ci<\/em>, il est encore plus beau ! Et <em>celui-là<\/em>, il est réussi également !<\/div><button class=\"speak-btn\" onclick=\"speak(&quot;Le pronom démonstratif remplace le nom de ce qu&#x27;on veut montrer : Regarde le château de sable, comme il est beau ! Oh, regarde celui-ci, il est encore plus beau ! Et celui-là, il est réussi également !&quot;)\">🔊 Écouter<\/button><\/div>", "<div class=\"scene\" data-color=\"var(--ai)\"><h1 class=\"sense-title\" style=\"font-size:24px;\">Masculin<\/h1><div class=\"dialogue-line c\" onclick=\"speak(&quot;singulier : celui · celui-ci · celui-là&quot;)\">singulier : celui · celui-ci · celui-là<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;pluriel : ceux · ceux-ci · ceux-là&quot;)\">pluriel : ceux · ceux-ci · ceux-là<\/div><button class=\"speak-btn\" onclick=\"speak(&quot;singulier : celui · celui-ci · celui-là pluriel : ceux · ceux-ci · ceux-là&quot;)\">🔊 Écouter<\/button><\/div>", "<div class=\"scene\" data-color=\"var(--teal)\"><h1 class=\"sense-title\" style=\"font-size:24px;\">Féminin et neutre<\/h1><div class=\"dialogue-line c\" onclick=\"speak(&quot;féminin singulier : celle · celle-ci · celle-là&quot;)\">féminin singulier : celle · celle-ci · celle-là<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;féminin pluriel : celles · celles-ci · celles-là&quot;)\">féminin pluriel : celles · celles-ci · celles-là<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;neutre : ce (c&#x27;) · ceci · cela (ça)&quot;)\">neutre : ce (c') · ceci · cela (ça)<\/div><button class=\"speak-btn\" onclick=\"speak(&quot;féminin singulier : celle · celle-ci · celle-là féminin pluriel : celles · celles-ci · celles-là neutre : ce (c&#x27;) · ceci · cela (ça)&quot;)\">🔊 Écouter<\/button><\/div>", "<div class=\"scene\" data-color=\"var(--pink)\"><h1 class=\"sense-title\" style=\"font-size:24px;\">Exemples<\/h1><div class=\"dialogue-line c\" onclick=\"speak(&quot;Je ne comprends pas ce que vous voulez dire. (ce = la chose que vous me dites)&quot;)\">Je ne comprends pas <em>ce<\/em> que vous voulez dire. (ce = la chose que vous me dites)<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;Vous avez raté le bus. Prenez donc celui de dix heures.&quot;)\">Vous avez raté le bus. Prenez donc <em>celui<\/em> de dix heures.<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;Il s&#x27;est passé beaucoup de choses mais cela ne change rien à nos projets.&quot;)\">Il s'est passé beaucoup de choses mais <em>cela<\/em> ne change rien à nos projets.<\/div><button class=\"speak-btn\" onclick=\"speak(&quot;Je ne comprends pas ce que vous voulez dire. (ce = la chose que vous me dites) Vous avez raté le bus. Prenez donc celui de dix heures. Il s&#x27;est passé beaucoup de choses mais cela ne change rien à nos projets.&quot;)\">🔊 Écouter<\/button><\/div>", "<div class=\"scene\" data-color=\"var(--suis)\"><h1 class=\"sense-title\" style=\"font-size:24px;\">A – ce / c&#x27;<\/h1><div class=\"dialogue-line c\" onclick=\"speak(&quot;Le pronom c&#x27; ou ce peut remplacer un groupe nominal ou une phrase entière :&quot;)\">Le pronom c' ou ce peut remplacer un groupe nominal ou une phrase entière :<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;Je viens de perdre mon travail. C&#x27;est très embêtant.&quot;)\">Je viens de perdre mon travail. <em>C'<\/em>est très embêtant.<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;C&#x27;est triste qu&#x27;elle soit malade.&quot;)\">C'est triste qu'elle soit malade.<\/div><button class=\"speak-btn\" onclick=\"speak(&quot;Le pronom c&#x27; ou ce peut remplacer un groupe nominal ou une phrase entière : Je viens de perdre mon travail. C&#x27;est très embêtant. C&#x27;est triste qu&#x27;elle soit malade.&quot;)\">🔊 Écouter<\/button><\/div>", "<div class=\"scene\" data-color=\"var(--ai)\"><h1 class=\"sense-title\" style=\"font-size:24px;\">B – celui, ceux, celle, celles<\/h1><div class=\"dialogue-line c\" onclick=\"speak(&quot;Ces pronoms sont suivis d&#x27;une proposition relative ou d&#x27;un complément de nom :&quot;)\">Ces pronoms sont suivis d'une proposition relative ou d'un complément de nom :<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;Parmi toutes les tenues de soirée de Marie, j&#x27;aime celles que sa mère lui a faites.&quot;)\">Parmi toutes les tenues de soirée de Marie, j'aime <em>celles<\/em> que sa mère lui a faites.<\/div><button class=\"speak-btn\" onclick=\"speak(&quot;Ces pronoms sont suivis d&#x27;une proposition relative ou d&#x27;un complément de nom : Parmi toutes les tenues de soirée de Marie, j&#x27;aime celles que sa mère lui a faites.&quot;)\">🔊 Écouter<\/button><\/div>", "<div class=\"scene\" data-color=\"var(--teal)\"><h1 class=\"sense-title\" style=\"font-size:24px;\">C – ceci, cela, ça<\/h1><div class=\"dialogue-line c\" onclick=\"speak(&quot;Ils peuvent représenter :&quot;)\">Ils peuvent représenter :<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;un nom : L&#x27;hypocrisie, je déteste ça.&quot;)\">un nom : L'hypocrisie, je déteste <em>ça<\/em>.<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;un infinitif : Dormir, j&#x27;adore ça.&quot;)\">un infinitif : Dormir, j'adore <em>ça<\/em>.<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;une proposition : Jean n&#x27;est pas encore arrivé, cela m&#x27;inquiète.&quot;)\">une proposition : Jean n'est pas encore arrivé, <em>cela<\/em> m'inquiète.<\/div><button class=\"speak-btn\" onclick=\"speak(&quot;Ils peuvent représenter : un nom : L&#x27;hypocrisie, je déteste ça. un infinitif : Dormir, j&#x27;adore ça. une proposition : Jean n&#x27;est pas encore arrivé, cela m&#x27;inquiète.&quot;)\">🔊 Écouter<\/button><\/div>", "<div class=\"scene\" data-color=\"var(--pink)\"><h1 class=\"sense-title\" style=\"font-size:24px;\">D – celui-ci, celui-là…<\/h1><div class=\"dialogue-line c\" onclick=\"speak(&quot;De toutes ces fleurs, c&#x27;est celle-là que je préfère.&quot;)\">De toutes ces fleurs, c'est <em>celle-là<\/em> que je préfère.<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;Si vous voulez un bon melon, je vous conseille celui-ci.&quot;)\">Si vous voulez un bon melon, je vous conseille <em>celui-ci<\/em>.<\/div><div class=\"dialogue-line c\" onclick=\"speak(&quot;celui-ci / celle-ci = proche ; celui-là / celle-là = plus éloigné.&quot;)\">celui-ci / celle-ci = proche ; celui-là / celle-là = plus éloigné.<\/div><button class=\"speak-btn\" onclick=\"speak(&quot;De toutes ces fleurs, c&#x27;est celle-là que je préfère. Si vous voulez un bon melon, je vous conseille celui-ci. celui-ci / celle-ci = proche ; celui-là / celle-là = plus éloigné.&quot;)\">🔊 Écouter<\/button><\/div>", "<div class=\"scene\" data-color=\"var(--teal)\"><h1 class=\"sense-title\" style=\"font-size:24px;\">🎮 Devine !<\/h1><img class=\"quiz-photo\" id=\"quizPhoto\" src=\"\" alt=\"\" style=\"display:none\"><p class=\"sentence\" id=\"quizTitle\" style=\"font-size:clamp(17px,4vw,22px);cursor:pointer\" onclick=\"speak(this.textContent)\"><\/p><div class=\"quiz-options\" id=\"quizOptions\"><\/div><div class=\"quiz-feedback\" id=\"quizFeedback\"><\/div><\/div>", "<div class=\"scene\" data-color=\"var(--gold)\"><h1 class=\"sense-title\">On révise ! 🧠<\/h1><div class=\"recap-grid\" id=\"recapGrid\"><div class=\"recap-item\" style=\"cursor:pointer\" onclick=\"speak(&quot;celui-ci : proche&quot;)\"><div class=\"em\">👉<\/div>celui-ci : proche<\/div><div class=\"recap-item\" style=\"cursor:pointer\" onclick=\"speak(&quot;celui-là : éloigné&quot;)\"><div class=\"em\">👈<\/div>celui-là : éloigné<\/div><div class=\"recap-item\" style=\"cursor:pointer\" onclick=\"speak(&quot;ceux · celles&quot;)\"><div class=\"em\">👥<\/div>ceux · celles<\/div><div class=\"recap-item\" style=\"cursor:pointer\" onclick=\"speak(&quot;ce (c&#x27;)&quot;)\"><div class=\"em\">🔹<\/div>ce (c&#x27;)<\/div><div class=\"recap-item\" style=\"cursor:pointer\" onclick=\"speak(&quot;cela · ça&quot;)\"><div class=\"em\">🔸<\/div>cela · ça<\/div><div class=\"recap-item\" style=\"cursor:pointer\" onclick=\"speak(&quot;celle-là que je préfère&quot;)\"><div class=\"em\">🌸<\/div>celle-là que je préfère<\/div><\/div><\/div>", "<div class=\"scene\" data-color=\"var(--pink)\"><div class=\"dialogue-line c\" onclick=\"speak(&quot;De toutes ces fleurs, c&#x27;est celle-là que je préfère.&quot;)\">« De toutes ces fleurs, c&#x27;est celle-là que je préfère. »<\/div><h1 class=\"sense-title\" style=\"margin-top:12px;\">🌟 Bravo !<\/h1><p class=\"sentence\">Bravo ! Maintenant, tu connais les pronoms démonstratifs ! 🎉<\/p><button class=\"speak-btn\" onclick=\"speak(&quot;Bravo ! Maintenant, tu connais les pronoms démonstratifs !&quot;)\">🔊 Écouter<\/button><\/div>"];

const stage=document.getElementById('stage');
stage.insertAdjacentHTML('beforeend', SCENES.join(''));
document.querySelectorAll('[data-img]').forEach(e=>{e.src=IMG[e.dataset.img];});
const scenes=document.querySelectorAll('.scene');
const dotsContainer=document.getElementById('dots');
const themeBand=document.getElementById('themeBand');
let current=0;
const quizSceneIndex=scenes.length-3;
scenes.forEach((s,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' on':'');dotsContainer.appendChild(d);});
function updateTheme(){const color=scenes[current].dataset.color;themeBand.style.background=`radial-gradient(circle at 50% 20%, ${color}33, transparent 60%), var(--cream)`;}
function render(){
  scenes.forEach((s,i)=>s.classList.toggle('active',i===current));
  [...dotsContainer.children].forEach((d,i)=>d.classList.toggle('on',i===current));
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===scenes.length-1;
  updateTheme();
  if(current===scenes.length-2)animateRecap();
  if(current===quizSceneIndex)startQuiz();
}
function go(delta){const next=current+delta;if(next<0||next>=scenes.length)return;current=next;render();}
function speak(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=0.85;
  const vs=window.speechSynthesis.getVoices();
  const v=vs.find(x=>x.lang==='fr-FR')||vs.find(x=>(x.lang||'').toLowerCase().startsWith('fr'));
  if(v)u.voice=v;
  window.speechSynthesis.speak(u);
}
function revealAnswer(id,btn){const a=document.getElementById(id);a.classList.add('shown');btn.style.display='none';speak(a.textContent);}
if('speechSynthesis' in window){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>{};}
function animateRecap(){
  document.querySelectorAll('#recapGrid .recap-item').forEach((it,i)=>{it.classList.remove('shown');setTimeout(()=>it.classList.add('shown'),80+i*100);});
}
let quizIndex=0;
function startQuiz(){quizIndex=0;renderQuizQuestion();}
function renderQuizQuestion(){
  const feedback=document.getElementById('quizFeedback');feedback.textContent='';
  const qp=document.getElementById('quizPhoto');
  if(quizIndex>=quiz.length){
    qp.style.display='none';
    document.getElementById('quizTitle').textContent='🎉 Bravo, tu as fini le jeu !';
    document.getElementById('quizOptions').innerHTML='';return;
  }
  const q=quiz[quizIndex];
  if(q.img){qp.style.display='block';qp.src=IMG[q.img];}else{qp.style.display='none';}
  document.getElementById('quizTitle').textContent=q.title;
  const optsDiv=document.getElementById('quizOptions');optsDiv.innerHTML='';
  q.options.forEach((opt,i)=>{const btn=document.createElement('button');btn.className='quiz-opt';btn.textContent=opt;btn.onclick=()=>answerQuiz(i,btn);optsDiv.appendChild(btn);});
}
function answerQuiz(i,btnEl){
  const q=quiz[quizIndex];
  const buttons=document.querySelectorAll('.quiz-opt');
  buttons.forEach(b=>b.onclick=null);
  if(i===q.correct){btnEl.classList.add('correct');document.getElementById('quizFeedback').textContent='✅ Bravo !';speak(q.options[i]+' ! Bravo !');}
  else{btnEl.classList.add('wrong');buttons[q.correct].classList.add('correct');document.getElementById('quizFeedback').textContent='❌ Pas tout à fait...';speak('La bonne réponse : '+q.options[q.correct]);}
  setTimeout(()=>{quizIndex++;renderQuizQuestion();},2600);
}
render();

</script>
</body>
</html>
